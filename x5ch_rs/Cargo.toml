[package]
name = "x5ch_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", default-features = false, features = ["gzip", "native-tls"] }
native-tls = "=0.2.11"
openssl-sys = "=0.9.95"
thiserror = "1"
url = "=2.4.1"
idna = "=0.4.0"
scraper = "0.19"
regex = "1"
html-escape = "0.2"
once_cell = "1"
encoding_rs = "=0.8.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
fs2 = "0.4"
nix = { version = "0.27", features = ["signal", "process"] }
ratatui = "0.26"
crossterm = "0.27"
